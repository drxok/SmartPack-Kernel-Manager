name: Compilar APK (Kernel Dr.xok)

on:
  push:
    branches: [ "drxok" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        id: build
        run: |
          set -o pipefail
          {
            echo "=== jitpack sCommon"; curl -s https://jitpack.io/api/builds/com.github.sunilpaulmathew/sCommon | head -c 3000; echo
            echo "=== jitpack RootFilePicker"; curl -s https://jitpack.io/api/builds/com.github.sunilpaulmathew/RootFilePicker | head -c 2000; echo
            echo "=== tags sCommon"; git ls-remote --tags https://github.com/sunilpaulmathew/sCommon | tail -15
            echo "=== tags RootFilePicker"; git ls-remote https://github.com/sunilpaulmathew/RootFilePicker | tail -8
          } > diag.log 2>&1
          gradle --no-daemon --stacktrace assembleFdroidRelease 2>&1 | tee build.log
        continue-on-error: true

      - name: Publicar resultado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            APK=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
            cp "$APK" SmartPack-Drxok.apk
            gh release create "$TAG" SmartPack-Drxok.apk build.log --target "${{ github.sha }}" \
              --title "SmartPack Dr.xok $TAG" --notes "OK - commit ${{ github.sha }}" --prerelease
          else
            { cat diag.log; echo; tail -n 400 build.log; } > build-erro.log
            gh release create "$TAG" build-erro.log --target "${{ github.sha }}" \
              --title "FALHOU $TAG" --notes "ERRO - commit ${{ github.sha }}" --prerelease
            exit 1
          fi
