apply plugin: 'com.android.application'

def keystoreFile = rootProject.file("app/drxok.jks")

android {

    if (keystoreFile.exists()) {
        signingConfigs {
            release {
                storeFile file("drxok.jks")
                storePassword "drxokapp"
                keyAlias "drxok"
                keyPassword "drxokapp"
            }
        }
    }

    namespace 'com.smartpack.kernelmanager'
    compileSdk 35

    defaultConfig {
        applicationId "com.smartpack.kernelmanager"
        minSdk 21
        targetSdk 34
        versionCode 181
        versionName "v18.1-drxok"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testFunctionalTest = false
        testHandleProfiling = false
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions = ["release"]
    productFlavors {
        pro {
            dimension "release"
            applicationIdSuffix '.pro'
        }
        fdroid {
            dimension "release"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    api(project(":seekbar"))

    implementation 'androidx.biometric:biometric:1.1.0'
    implementation ('androidx.preference:preference:1.2.0') {
        exclude group: 'androidx.lifecycle', module:'lifecycle-viewmodel-ktx'
    }
    implementation 'com.github.ozodrukh:CircularReveal:1.3.1'

    implementation project(":sCommon:adapters")
    implementation project(":sCommon:credits")
    implementation project(":sCommon:crashreporter")
    implementation project(":sCommon:translatorutils")

    implementation('com.github.sunilpaulmathew:RootFilePicker:c918e8fad0') {
        exclude group: 'com.github.sunilpaulmathew.sCommon'
    }

    def libSUVersion = '4.0.3'
    implementation "com.github.topjohnwu.libsu:core:${libSUVersion}"
    implementation "com.github.topjohnwu.libsu:io:${libSUVersion}"

    implementation 'com.google.android.apps.dashclock:dashclock-api:2.0.0'

    implementation "com.google.android.material:material:${materialLibVersion}"

    implementation 'org.cyanogenmod:platform.sdk:6.0'
}